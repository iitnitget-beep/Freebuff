name: Android APK
on:
  push:
    branches: [main, cybnate-agent-apk]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CybNate-Agent-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cybnate-agent-debug-apk
          path: CybNate-Agent-debug.apk
      - name: Publish APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: CybNate Agent APK #${{ github.run_number }}
          files: CybNate-Agent-debug.apk
